<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixelator</title>
<meta name="description" content="Turn a photo into a clean pixelated image, right in your browser.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <h1>Pixelator</h1>
  <p class="tagline">Upload a photo, pixelate it, download it. Nothing else.</p>
</header>

<main>
  <!-- Shown until an image is loaded -->
  <section
    id="drop-zone"
    class="drop-zone"
    role="button"
    tabindex="0"
    aria-label="Load an image: click to browse, drag and drop a file, or paste from clipboard"
  >
    <p>Drop an image here, click to browse, or paste (Ctrl/Cmd+V)</p>
    <input type="file" id="file-input" accept="image/*" class="visually-hidden" aria-hidden="true" tabindex="-1">
  </section>

  <p id="status" class="status" role="alert" hidden></p>

  <!-- Shown once an image is loaded -->
  <section id="editor" class="editor" hidden>
    <div class="canvas-stage" id="canvas-stage">
      <canvas id="preview-canvas" class="stage-canvas"></canvas>
    </div>

    <p id="info-line" class="info-line" aria-live="polite"></p>

    <div class="controls">
      <div class="control">
        <label for="pixel-size">
          Pixel size: <span id="pixel-size-value">4</span>px
        </label>
        <input type="range" id="pixel-size" min="1" max="32" step="1" value="4">
      </div>

      <div class="control control-toggle">
        <input type="checkbox" id="dither-toggle">
        <label for="dither-toggle">Dither texture</label>
      </div>

      <div class="control-group" id="dither-options">
        <div class="control">
          <label for="dither-colors">
            Number of colors: <span id="dither-colors-value">8</span>
          </label>
          <input type="range" id="dither-colors" min="2" max="32" step="1" value="8" disabled>
        </div>

        <div class="control">
          <label for="dither-strength">
            Dither strength: <span id="dither-strength-value">50</span>%
          </label>
          <input type="range" id="dither-strength" min="0" max="100" step="1" value="50" disabled>
        </div>
      </div>

      <div class="actions">
        <button type="button" id="download-btn">Download PNG</button>
        <button type="button" id="reset-btn">Reset</button>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <p>Runs entirely in your browser. No images are uploaded anywhere.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
